spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:hotel/.env[.properties]"
  application:
    name: hotel
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hotel?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: hotel_user
    password: hotel9876!
  jpa:
    hibernate:
      ddl-auto: update
      # create-drop, update, validate, none
#      naming:
#        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      dialect: org.hibernate.dialect.MySQL8InnoDBDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8989
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

hotel:
  save-folder: ./uploads

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mjc.hotel
  configuration:
    map-underscore-to-camel-case: true

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}

auth:
  email:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-expiration-minutes: 10
    token-expiration-minutes: 30
    resend-cooldown-seconds: 60
    max-attempts: 5
    hash-secret: ${EMAIL_VERIFICATION_SECRET:change-this-email-verification-secret}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
