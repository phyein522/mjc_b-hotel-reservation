plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "7.3.1.8318"
}

group = 'com.mjc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
}

sonar {
	properties {
		// 공통 속성
		property "sonar.java.binaries", "build/classes/java/main"

		// 분기 처리
		if (project.hasProperty('cwc')) {
			// ./gradlew sonar -Pcwc
			property "sonar.projectKey", "hotel"
			property "sonar.projectName", "hotel"
			property "sonar.host.url", "http://localhost:9000"
			property "sonar.token", "sqp_fcafee9f0cd6d910b57414a21b0ef631240acfa7"
		} else {
			property "sonar.projectKey", "phyein522_mjc_b-hotel-reservation"
			property "sonar.projectName", "mjc_b-hotel-reservation"
			property "sonar.host.url", "http://localhost:9000"
			property "sonar.token", "sqp_bd0e30194e2c8e88c7b4a040c9ff8a2fc946a683"
		}
	}
}

sonar {
	properties {
		property "sonar.projectKey", "hotel"
		property "sonar.projectName", "hotel"
		property "sonar.host.url", "http://localhost:9000"
		property "sonar.token", "sqp_fcafee9f0cd6d910b57414a21b0ef631240acfa7"
		property "sonar.java.binaries", "build/classes/java/main"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
